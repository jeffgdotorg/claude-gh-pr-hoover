apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-pr-hoover
  labels:
    app: github-pr-hoover
spec:
  replicas: 2
  selector:
    matchLabels:
      app: github-pr-hoover
  template:
    metadata:
      labels:
        app: github-pr-hoover
    spec:
      containers:
      - name: github-pr-hoover
        image: github-pr-hoover:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          protocol: TCP
        env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-pr-hoover-secret
              key: GITHUB_TOKEN
        - name: PORT
          value: "8080"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
