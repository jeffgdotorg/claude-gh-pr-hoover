[pytest]
# Pytest configuration
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage configuration
addopts =
    --verbose
    --strict-markers
    --tb=short

# Ignore directories
norecursedirs =
    .git
    .github
    venv
    __pycache__
    openshift

# Environment variables for testing
env =
    GITHUB_TOKEN=fake-token-for-testing
